name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: liner, POSTGRES_USER: liner, POSTGRES_PASSWORD: liner }
        ports: ["5433:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.digitalocean.com/halfnotes
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --push \
            -t $REGISTRY/liner:${{ github.sha }} \
            -t $REGISTRY/liner:latest .

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Configure kubectl
        run: |
          CLUSTER=$(doctl kubernetes cluster list --format Name --no-header | grep halfnotes-dev | head -1)
          doctl kubernetes cluster kubeconfig save "$CLUSTER"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pulumi/actions@v5
      - name: Install infra dependencies
        working-directory: infra
        run: npm ci
      - name: Deploy
        working-directory: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi config set image registry.digitalocean.com/halfnotes/liner:${{ github.sha }} -s dev
          pulumi up --yes -s dev
