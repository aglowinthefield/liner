# Dependencies for local development. Run `cargo run` on the host, or
# `docker compose --profile app up` to run liner in a container too.
services:
  postgres:
    image: postgres:17
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: liner
      POSTGRES_USER: liner
      POSTGRES_PASSWORD: liner
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  liner:
    profiles: [app]
    build: .
    ports: ["3002:3002"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgres://liner:liner@postgres:5432/liner
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "false"

  worker:
    profiles: [app]
    build: .
    command: ["liner", "worker"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgres://liner:liner@postgres:5432/liner
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:
